name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static Next.js site
        run: npm run build

      - name: Verify static pages
        run: |
          test -f out/index.html
          test -f out/catalog/index.html
          test -f out/favorites/index.html
          test -f out/cart/index.html
          test -f out/checkout/index.html
          test -f out/404.html

      - name: Check Workers static asset config without deploying
        run: npx --yes wrangler@4.149.0 deploy --dry-run
